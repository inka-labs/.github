name: Suggest an idea
description: Something that would make the tool more useful
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: What are you trying to get done?
      description: Describe the job. That helps more than describing a feature.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
